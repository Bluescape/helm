{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dex.serviceAccountName" . }}
  namespace: {{ include "dex.namespace" . }}
  labels:
    {{- include "dex.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Manage the empty list too, so upgrades clear stale ServiceAccount pull secrets
# that would override the Vault webhook's default registry credentials.
imagePullSecrets: {{ .Values.imagePullSecrets | toJson }}
{{- end }}
